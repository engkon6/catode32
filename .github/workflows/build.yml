name: Build Firmware

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.1

      - name: Build MicroPython cross-compiler
        run: |
          mkdir -p ~/esp
          git clone https://github.com/micropython/micropython.git ~/esp/micropython
          cd ~/esp/micropython
          git submodule update --init --recursive
          make -C mpy-cross

      - name: Build Firmware
        run: |
          # Diagnostics
          export IDF_PATH=/opt/esp/idf
          export MICROPYTHON_DIR=/home/runner/esp/micropython
          
          # Run build script with explicit environment
          IDF_PATH=$IDF_PATH MICROPYTHON_DIR=$MICROPYTHON_DIR ./tools/build_firmware.sh build esp32c3

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: /home/runner/esp/micropython/ports/esp32/build/micropython.bin
